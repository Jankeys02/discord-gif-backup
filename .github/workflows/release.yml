name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --- Add project-specific build/package steps here ---
      # e.g. npm run build, then package an installer / zip artifacts into ./release
      # - run: npm run build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Attach built artifacts once the build steps above produce them:
          # files: |
          #   release/*
