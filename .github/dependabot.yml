version: 2
updates:
  # npm dependencies (package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch into one PR. Majors come as separate, reviewable PRs.
      dependencies:
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
